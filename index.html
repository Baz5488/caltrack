<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Calorie Tracker</title>
  <style>
    :root { --bg:#f4f7f5; --card:#ffffff; --text:#17251d; --muted:#5a6b61; --accent:#1f7a4c; --accent-light:#e8f3ed; --border:#dce6df; --danger:#c93b3b; }
    * { box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { margin:0; background:var(--bg); color:var(--text); padding:16px; }
    .container { max-width:720px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 2px 6px rgba(0,0,0,0.03); }
    h1,h2,h3 { margin:0 0 12px; }
    h1 { font-size:1.35rem; }
    h2 { font-size:1.1rem; }
    .row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    .field { display:flex; flex-direction:column; flex:1; min-width:110px; }
    label { font-size:0.8rem; color:var(--muted); margin-bottom:4px; font-weight:600; }
    input, select { padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:0.95rem; background:#fff; color:var(--text); }
    button { padding:9px 14px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:0.9rem; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    button.secondary { background:var(--accent-light); color:var(--accent); }
    button.danger { background:#fdeaea; color:var(--danger); padding:5px 9px; font-size:0.8rem; }
    .hidden { display:none !important; }
    .tiny { font-size:0.8rem; color:var(--muted); margin:6px 0; }
    .summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
    .stat { background:var(--bg); padding:10px; border-radius:8px; text-align:center; }
    .stat b { display:block; font-size:1.1rem; color:var(--accent); }
    .bar-wrap { background:var(--border); height:10px; border-radius:99px; overflow:hidden; margin-top:8px; }
    .bar-fill { background:var(--accent); height:100%; width:0%; transition:width 0.25s; }
    .list-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); gap:8px; }
    .list-item:last-child { border-bottom:none; }
    .badge { background:var(--accent-light); color:var(--accent); padding:2px 8px; border-radius:99px; font-size:0.75rem; font-weight:600; }
    .photo-btn { cursor:pointer; display:inline-flex; align-items:center; gap:6px; padding:9px 14px; background:#2563eb; color:#fff; border-radius:8px; font-weight:600; font-size:0.9rem; margin:0; }
  </style>
</head>
<body>
<div class="container">
  <!-- Header & Date -->
  <div class="card">
    <div class="row" style="justify-content:space-between; align-items:center;">
      <h1>Personal Calorie Tracker</h1>
      <input type="date" id="logDate">
    </div>
    <div class="row" style="margin-top:10px;">
      <div class="field"><label>Daily Calorie Target</label><input type="number" id="targetCal" value="1800"></div>
      <div class="field"><label>Daily Protein Target (g)</label><input type="number" id="targetPro" value="120"></div>
      <button id="saveTargetsBtn" class="secondary" type="button">Save Targets</button>
    </div>
    <div class="summary-grid">
      <div class="stat"><b id="sumCal">0</b><span class="tiny">kcal</span></div>
      <div class="stat"><b id="sumPro">0g</b><span class="tiny">Protein</span></div>
      <div class="stat"><b id="sumCarb">0g</b><span class="tiny">Carbs</span></div>
      <div class="stat"><b id="sumFat">0g</b><span class="tiny">Fat</span></div>
    </div>
    <div class="bar-wrap"><div class="bar-fill" id="calBar"></div></div>
    <p id="syncStatus" class="tiny">Ready</p>
  </div>

  <!-- Log Meal -->
  <div class="card">
    <h2>Log Food</h2>
    <div class="row">
      <div class="field"><label>Meal</label>
        <select id="mealSelect">
          <option>Breakfast</option>
          <option>Lunch</option>
          <option>Dinner</option>
          <option>Snack</option>
        </select>
      </div>
      <div class="field" style="flex:2;"><label>Food</label><select id="foodSelect"></select></div>
      <div class="field"><label>Servings</label><input type="number" id="servingsInput" value="1" step="0.1" min="0.1"></div>
      <button id="addLogBtn" type="button">Add to Log</button>
    </div>
    <div id="todayLogs" style="margin-top:14px;"></div>
  </div>

  <!-- Add New Food + Barcode & Label Scanner -->
  <div class="card">
    <div class="row" style="justify-content:space-between; align-items:center;">
      <h2>Add / Scan Food</h2>
      <button id="scanOpen" class="secondary" type="button">Scan Barcode / Label</button>
    </div>

    <!-- Scanner Panel -->
    <div id="scannerPanel" class="hidden" style="border:1px solid #dce6df;background:#f7faf8;border-radius:10px;padding:12px;margin:10px 0">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <b>Barcode & Label Scanner</b>
        <button id="scanClose" class="secondary" type="button">Close</button>
      </div>

      <div class="row" style="margin-top:10px;">
        <button id="startCamBtn" type="button">Start Barcode Camera</button>
        <label class="photo-btn">
          📷 Scan Nutrition Label
          <input type="file" id="label-photo-input" accept="image/*" capture="environment" hidden>
        </label>
      </div>

      <video id="scanVideo" playsinline muted style="display:none;width:100%;max-height:260px;object-fit:cover;border-radius:8px;background:#17251d;margin:8px 0"></video>
      <p id="scanStatus" class="tiny">Start the camera for a barcode, snap a nutrition label photo, or type the barcode below.</p>

      <div class="row">
        <div class="field">
          <label>Barcode number (JAN / EAN / UPC)</label>
          <input id="barcodeInput" inputmode="numeric" autocomplete="off" placeholder="e.g. 4901234567890">
        </div>
        <button id="barcodeLookup" type="button">Look up</button>
      </div>
    </div>

    <!-- Food Form -->
    <div class="row" style="margin-top:10px;">
      <div class="field" style="flex:2;"><label>Food Name</label><input id="fName" placeholder="e.g. Grilled Salmon"></div>
      <div class="field"><label>Brand (optional)</label><input id="fBrand" placeholder="e.g. Meiji"></div>
      <div class="field"><label>Barcode</label><input id="fBarcode" placeholder="Optional"></div>
    </div>
    <div class="row" style="margin-top:10px;">
      <div class="field"><label>Serving Size</label><input type="number" id="fServing" value="100"></div>
      <div class="field"><label>Unit</label><input id="fUnit" value="g"></div>
      <div class="field"><label>Calories (kcal)</label><input type="number" id="fCal" value="0"></div>
      <div class="field"><label>Protein (g)</label><input type="number" id="fPro" value="0" step="0.1"></div>
      <div class="field"><label>Carbs (g)</label><input type="number" id="fCarb" value="0" step="0.1"></div>
      <div class="field"><label>Fat (g)</label><input type="number" id="fFat" value="0" step="0.1"></div>
    </div>
    <div style="margin-top:12px;">
      <button id="saveFoodBtn" type="button">Save Food to Database</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://google.com';
const STORAGE_KEY = 'calorie_tracker_v1';
const $ = id => document.getElementById(id);

const defaultState = {
  targets: { calories: 1800, protein: 120 },
  foods: [
    { id: 'f1', name: 'Boiled Egg (1 medium)', brand: '', servingAmount: 1, unit: 'egg', calories: 72, protein: 6.3, carbs: 0.4, fat: 4.8, barcode: '' },
    { id: 'f2', name: 'Brown Rice (Cooked)', brand: '', servingAmount: 150, unit: 'g', calories: 225, protein: 4.2, carbs: 47.0, fat: 1.5, barcode: '' }
  ],
  logs: []
};

let state = loadLocalState();
$('logDate').value = new Date().toISOString().slice(0, 10);

function loadLocalState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? { ...defaultState, ...JSON.parse(raw) } : structuredClone(defaultState);
  } catch {
    return structuredClone(defaultState);
  }
}

function saveLocalState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

async function apiPost(action, data = {}) {
  if (!APPS_SCRIPT_URL) return null;
  try {
    $('syncStatus').textContent = 'Syncing with Google Sheets...';
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, data })
    });
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message);
    $('syncStatus').textContent = 'Synced with Google Sheets';
    return json.data;
  } catch (err) {
    console.warn('Cloud sync warning:', err);
    $('syncStatus').textContent = 'Saved locally (offline / sync error)';
    return null;
  }
}

async function initialCloudLoad() {
  const remote = await apiPost('getAllData');
  if (remote && Array.isArray(remote.foods)) {
    if (remote.foods.length > 0) state.foods = remote.foods;
    if (Array.isArray(remote.logs)) state.logs = remote.logs;
    if (remote.targets) state.targets = remote.targets;
    saveLocalState();
    $('targetCal').value = state.targets.calories || 1800;
    $('targetPro').value = state.targets.protein || 120;
    render();
  }
}

function render() {
  const date = $('logDate').value;
  // Populate food dropdown
  const select = $('foodSelect');
  select.innerHTML = '';
  state.foods.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.id;
    opt.textContent = `${f.name}${f.brand ? ' (' + f.brand + ')' : ''} - ${f.calories} kcal / ${f.servingAmount}${f.unit}`;
select.appendChild(opt);
});
// Render logs for selected date
const dayLogs = state.logs.filter(l => l.date === date);
const logsDiv = $('todayLogs');
logsDiv.innerHTML = dayLogs.length ? '' : 'No foods logged for this date yet.';
let cal = 0, pro = 0, carb = 0, fat = 0;
dayLogs.forEach(item => {
cal += Number(item.calories) || 0;
pro += Number(item.protein) || 0;
carb += Number(item.carbs) || 0;
fat += Number(item.fat) || 0;
const row = document.createElement('div');
row.className = 'list-item';
row.innerHTML = <div> <span class="badge">${item.meal}</span> <b>${item.foodName}</b> × ${item.servings} <div class="tiny">${Math.round(item.calories)} kcal | P: ${Number(item.protein).toFixed(1)}g | C: ${Number(item.carbs).toFixed(1)}g | F: ${Number(item.fat).toFixed(1)}g</div> </div> <button class="danger" type="button">Delete</button>;
row.querySelector('button').onclick = async () => {
state.logs = state.logs.filter(x => x.id !== item.id);
saveLocalState();
render();
await apiPost('deleteLog', { id: item.id });
};
logsDiv.appendChild(row);
});
$('sumCal').textContent = Math.round(cal);
$('sumPro').textContent = ${pro.toFixed(1)}g;
$('sumCarb').textContent = ${carb.toFixed(1)}g;
$('sumFat').textContent = ${fat.toFixed(1)}g;
const pct = Math.min(100, Math.round((cal / (state.targets.calories || 1800)) * 100));
$('calBar').style.width = ${pct}%;
}
// Event Listeners: Targets, Log, Save Food
$('logDate').onchange = render;
$('saveTargetsBtn').onclick = async () => {
state.targets = {
calories: Number($('targetCal').value) || 1800,
protein: Number($('targetPro').value) || 120
};
saveLocalState();
render();
await apiPost('saveTargets', state.targets);
};
$('addLogBtn').onclick = async () => {
const food = state.foods.find(f => f.id === $('foodSelect').value);
if (!food) return alert('Please add or select a food first.');
const servings = Number($('servingsInput').value) || 1;
const entry = {
id: 'log_' + Date.now(),
date: $('logDate').value,
meal: $('mealSelect').value,
foodId: food.id,
foodName: food.name,
brand: food.brand || '',
servings,
calories: Math.round(food.calories * servings),
protein: Number((food.protein * servings).toFixed(1)),
carbs: Number((food.carbs * servings).toFixed(1)),
fat: Number((food.fat * servings).toFixed(1))
};
state.logs.push(entry);
saveLocalState();
render();
await apiPost('addLog', entry);
};
$('saveFoodBtn').onclick = async () => {
const name = $('fName').value.trim();
if (!name) return alert('Please enter a food name.');
const food = {
id: 'food_' + Date.now(),
name,
brand: $('fBrand').value.trim(),
barcode: $('fBarcode').value.trim(),
servingAmount: Number($('fServing').value) || 100,
unit: $('fUnit').value.trim() || 'g',
calories: Number($('fCal').value) || 0,
protein: Number($('fPro').value) || 0,
carbs: Number($('fCarb').value) || 0,
fat: Number($('fFat').value) || 0
};
state.foods.unshift(food);
saveLocalState();
render();
$('foodSelect').value = food.id;
['fName', 'fBrand', 'fBarcode'].forEach(id => $(id).value = '');
await apiPost('saveFood', food);
alert('Food saved!');
};
// Barcode Camera & Lookup
let scanStream = null, scanTimer = null;
function stopScanner() {
if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
$('scanVideo').style.display = 'none';
}
$('scanOpen').onclick = () => $('scannerPanel').classList.remove('hidden');
$('scanClose').onclick = () => { stopScanner(); $('scannerPanel').classList.add('hidden'); };
$('startCamBtn').onclick = async () => {
try {
stopScanner();
scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
const video = $('scanVideo');
video.srcObject = scanStream;
video.style.display = 'block';
await video.play();
$('scanStatus').textContent = 'Point camera at barcode...';
if ('BarcodeDetector' in window) {
const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
scanTimer = setInterval(async () => {
try {
const codes = await detector.detect(video);
if (codes.length > 0) {
const code = codes[0].rawValue;
$('barcodeInput').value = code;
stopScanner();
lookupBarcode(code);
}
} catch {}
}, 400);
} else {
$('scanStatus').textContent = 'Live auto-detect not supported on this browser—enter barcode below or snap the nutrition label.';
}
} catch (err) {
$('scanStatus').textContent = 'Camera blocked or unavailable: ' + err.message;
}
};
async function lookupBarcode(rawCode) {
const code = String(rawCode || '').trim();
if (!code) return;
$('barcodeLookup').disabled = true;
$('scanStatus').textContent = Looking up ${code}...;
$('fBarcode').value = code;
// 1. Check saved foods first
const existing = state.foods.find(f => String(f.barcode) === code);
if (existing) {
$('foodSelect').value = existing.id;
$('scanStatus').textContent = Found in your saved foods: ${existing.name};
$('barcodeLookup').disabled = false;
return;
}
// 2. Query Open Food Facts v2 API
try {
const res = await fetch(https://openfoodfacts.org{encodeURIComponent(code)}.json?fields=product_name,brands,nutriments);
const data = await res.json();
if (data.status === 1 && data.product) {
const p = data.product;
const n = p.nutriments || {};
$('fName').value = p.product_name || '';
$('fBrand').value = p.brands || '';
$('fServing').value = 100;
$('fUnit').value = 'g';
$('fCal').value = Math.round(n['energy-kcal_100g'] || n['energy-kcal'] || 0);
$('fPro').value = Number((n.proteins_100g || n.proteins || 0).toFixed(1));
$('fCarb').value = Number((n.carbohydrates_100g || n.carbohydrates || 0).toFixed(1));
$('fFat').value = Number((n.fat_100g || n.fat || 0).toFixed(1));
$('scanStatus').textContent = 'Product loaded into form below! Review and click "Save Food to Database".';
} else {
$('scanStatus').textContent = 'Barcode not in online database. Tap "📷 Scan Nutrition Label" to fill from photo!';
}
} catch {
$('scanStatus').textContent = 'Could not retrieve the product. Check your internet connection or scan the nutrition label.';
} finally {
$('barcodeLookup').disabled = false;
}
}
$('barcodeLookup').onclick = () => lookupBarcode($('barcodeInput').value);
$('barcodeInput').addEventListener('keydown', e => { if (e.key === 'Enter') lookupBarcode($('barcodeInput').value); });
window.addEventListener('pagehide', stopScanner);
// Photo Nutrition Label Scanner (via Code.gs Gemini Vision)
$('label-photo-input').addEventListener('change', async (e) => {
const file = e.target.files[0];
if (!file) return;
$('scanStatus').textContent = 'Reading nutrition label photo with AI...';
try {
const { base64, mimeType } = await compressImageToBase64(file, 1024);
const res = await fetch(APPS_SCRIPT_URL, {
method: 'POST',
headers: { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({
action: 'scanLabel',
data: { imageBase64: base64, mimeType }
})
});
const result = await res.json();
if (result.status !== 'ok') throw new Error(result.message);
const item = result.data;
if (item.name) $('fName').value = item.name;
$('fServing').value = item.servingAmount || 1;
$('fUnit').value = item.unit || 'serving';
$('fCal').value = Math.round(item.calories || 0);
$('fPro').value = Number(item.protein || 0);
$('fCarb').value = Number(item.carbs || 0);
$('fFat').value = Number(item.fat || 0);
$('scanStatus').textContent = 'Nutrition label extracted! Verify the numbers below and click "Save Food to Database".';
} catch (err) {
$('scanStatus').textContent = 'Label scan failed: ' + err.message;
alert('Label scan failed: ' + err.message);
} finally {
e.target.value = '';
}
});
function compressImageToBase64(file, maxWidth) {
return new Promise((resolve, reject) => {
const reader = new FileReader();
reader.onload = (event) => {
const img = new Image();
img.onload = () => {
const scale = Math.min(1, maxWidth / img.width);
const canvas = document.createElement('canvas');
canvas.width = img.width * scale;
canvas.height = img.height * scale;
canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
};
img.onerror = reject;
img.src = event.target.result;
};
reader.onerror = reject;
reader.readAsDataURL(file);
});
}
// Initialize UI
$('targetCal').value = state.targets.calories || 1800;
$('targetPro').value = state.targets.protein || 120;
render();
initialCloudLoad();

```javascript
const SHEETS = {
  LOGS: 'FoodLogs',
  DB: 'FoodDatabase',
  SETTINGS: 'Settings'
};

function doGet(e) {
  if (e && e.parameter && e.parameter.action) {
    return handleApiRequest(e.parameter.action, e.parameter);
  }
  return ContentService.createTextOutput(JSON.stringify({ status: 'ok', message: 'Calorie Tracker API running' }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    const payload = JSON.parse(e.postData.contents);
    const result = handleApiRequest(payload.action, payload.data || {});
    return ContentService.createTextOutput(JSON.stringify({ status: 'ok', data: result }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: err.message }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function handleApiRequest(action, data) {
  setupSheetsIfNeeded();

  switch (action) {
    case 'getAllData':
      return getAllData();
    case 'addLog':
      return addLogEntry(data);
    case 'deleteLog':
      return deleteLogEntry(data.id);
    case 'saveFood':
      return saveFoodItem(data);
    case 'deleteFood':
      return deleteFoodItem(data.id);
    case 'saveTargets':
      return saveTargets(data.calories, data.protein);
    case 'scanLabel':
      return scanNutritionLabel(data.imageBase64, data.mimeType);
    default:
      throw new Error('Unknown action: ' + action);
  }
}

function setupSheetsIfNeeded() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();

  let logSheet = ss.getSheetByName(SHEETS.LOGS);
  if (!logSheet) {
    logSheet = ss.insertSheet(SHEETS.LOGS);
    logSheet.appendRow(['id', 'date', 'meal', 'foodId', 'foodName', 'brand', 'servings', 'calories', 'protein', 'carbs', 'fat', 'createdAt']);
    logSheet.setFrozenRows(1);
  }

  let dbSheet = ss.getSheetByName(SHEETS.DB);
  if (!dbSheet) {
    dbSheet = ss.insertSheet(SHEETS.DB);
    dbSheet.appendRow(['id', 'name', 'brand', 'category', 'servingAmount', 'unit', 'calories', 'protein', 'carbs', 'fat', 'barcode']);
    dbSheet.setFrozenRows(1);
  }

  let settingsSheet = ss.getSheetByName(SHEETS.SETTINGS);
  if (!settingsSheet) {
    settingsSheet = ss.insertSheet(SHEETS.SETTINGS);
    settingsSheet.appendRow(['key', 'value']);
    settingsSheet.appendRow(['calorieTarget', 1800]);
    settingsSheet.appendRow(['proteinTarget', 120]);
    settingsSheet.setFrozenRows(1);
  }
}

function getAllData() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  return {
    logs: sheetToObjects(ss.getSheetByName(SHEETS.LOGS)),
    foods: sheetToObjects(ss.getSheetByName(SHEETS.DB)),
    targets: getTargets()
  };
}

function addLogEntry(entry) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEETS.LOGS);
  const id = entry.id || Utilities.getUuid();
  const createdAt = new Date().toISOString();
  sheet.appendRow([
    id, entry.date, entry.meal, entry.foodId || '', entry.foodName, entry.brand || '',
    Number(entry.servings) || 1, Number(entry.calories) || 0, Number(entry.protein) || 0,
    Number(entry.carbs) || 0, Number(entry.fat) || 0, createdAt
  ]);
  return { ...entry, id, createdAt };
}

function deleteLogEntry(id) {
  return deleteRowById(SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEETS.LOGS), id);
}

function saveFoodItem(food) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEETS.DB);
  const id = food.id || Utilities.getUuid();
  const rowValues = [
    id, food.name, food.brand || '', food.category || 'Other',
    Number(food.servingAmount) || 100, food.unit || 'g',
    Number(food.calories) || 0, Number(food.protein) || 0,
    Number(food.carbs) || 0, Number(food.fat) || 0, food.barcode || ''
  ];
  const rowIndex = findRowIndexById(sheet, id);
  if (rowIndex > 1) {
    sheet.getRange(rowIndex, 1, 1, rowValues.length).setValues([rowValues]);
  } else {
    sheet.appendRow(rowValues);
  }
  return { ...food, id };
}

function deleteFoodItem(id) {
  return deleteRowById(SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEETS.DB), id);
}

function getTargets() {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEETS.SETTINGS);
  const data = sheet.getDataRange().getValues();
  const targets = { calories: 1800, protein: 120 };
  for (let i = 1; i < data.length; i++) {
    if (data[i][0] === 'calorieTarget') targets.calories = Number(data[i][1]) || 1800;
    if (data[i][0] === 'proteinTarget') targets.protein = Number(data[i][1]) || 120;
  }
  return targets;
}

function saveTargets(calories, protein) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEETS.SETTINGS);
  const data = sheet.getDataRange().getValues();
  for (let i = 1; i < data.length; i++) {
    if (data[i][0] === 'calorieTarget') sheet.getRange(i + 1, 2).setValue(Number(calories) || 1800);
    if (data[i][0] === 'proteinTarget') sheet.getRange(i + 1, 2).setValue(Number(protein) || 120);
  }
  return { calories: Number(calories), protein: Number(protein) };
}

function scanNutritionLabel(imageBase64, mimeType) {
  const apiKey = PropertiesService.getScriptProperties().getProperty('GEMINI_API_KEY');
  if (!apiKey) throw new Error('GEMINI_API_KEY is not set in Script Properties.');

  const url = 'https://googleapis.com';
  const prompt = [
    'Extract nutrition facts from this product label image (supports English and Japanese 栄養成分表示).',
    'Return ONLY valid JSON with these exact keys:',
    '{ "name": string, "servingAmount": number, "unit": string, "calories": number, "protein": number, "carbs": number, "fat": number }.',
    'If a value is missing, use 0. Round calories to a whole number and macros to 1 decimal place.'
  ].join(' ');

  const payload = {
    contents: [{
      parts: [
        { text: prompt },
        { inline_data: { mime_type: mimeType || 'image/jpeg', data: imageBase64 } }
      ]
    }],
    generationConfig: { responseMimeType: 'application/json', temperature: 0.1 }
  };

  const response = UrlFetchApp.fetch(url, {
    method: 'post',
    contentType: 'application/json',
    headers: { 'x-goog-api-key': apiKey },
    payload: JSON.stringify(payload),
    muteHttpExceptions: true
  });

  const json = JSON.parse(response.getContentText());
  if (response.getResponseCode() !== 200) {
    throw new Error(json.error ? json.error.message : 'Gemini API error');
  }

  return JSON.parse(json.candidates[0].content.parts[0].text);
}

function sheetToObjects(sheet) {
  const values = sheet.getDataRange().getValues();
  if (values.length <= 1) return [];
  const headers = values[0];
  return values.slice(1).map(row => {
    const obj = {};
    headers.forEach((header, idx) => {
      let val = row[idx];
      if (val instanceof Date) val = Utilities.formatDate(val, Session.getScriptTimeZone(), 'yyyy-MM-dd');
      obj[header] = val;
    });
    return obj;
  });
}

function findRowIndexById(sheet, id) {
  const data = sheet.getDataRange().getValues();
  for (let i = 1; i < data.length; i++) {
    if (String(data[i][0]) === String(id)) return i + 1;
  }
  return -1;
}

function deleteRowById(sheet, id) {
  const rowIndex = findRowIndexById(sheet, id);
  if (rowIndex > 1) { sheet.deleteRow(rowIndex); return true; }
  return false;
}
